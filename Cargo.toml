[workspace]
members = [
    ".",
    "crates/vfs-proto",
    "crates/jjfsctl",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
cc-common = { git = "https://github.com/DanielSperry/jj-commit-cloud.git", rev = "cf8df8b5e76934956049a39aa4504616f3bd58bc" }
cc-lib = { git = "https://github.com/DanielSperry/jj-commit-cloud.git", rev = "cf8df8b5e76934956049a39aa4504616f3bd58bc" }
clap = { version = "4.6.1", features = ["derive", "env"] }
fuser = "0.18.0"
futures = "0.3.33"
itertools = "0.15.0"
jj-lib = "0.43.0"
libc = "0.2.186"
pollster = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ustr = "1.1.0"

[package]
name = "jjfsd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
test-helpers = ["dep:tempfile", "dep:pollster"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
fuser.workspace = true
futures.workspace = true
itertools.workspace = true
jj-lib.workspace = true
libc.workspace = true
pollster = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ustr.workspace = true

[dev-dependencies]
jjfsd = { path = ".", features = ["test-helpers"] }
pollster.workspace = true
tempfile.workspace = true
