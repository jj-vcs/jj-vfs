name: license headers

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-license-headers:
    name: check (license headers)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that changed source files carry the license header
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.rs|*.proto|*.sql) ;;
              *) continue ;;
            esac
            if ! head -n 5 "$f" | grep -q '^\(//\|--\) Copyright 2026 Google LLC$'; then
              echo "::error file=$f,line=1::Missing 'Copyright 2026 Google LLC' license header"
              missing=1
            fi
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo "See the Source Code Headers section of the README for the required header."
            exit 1
          fi
